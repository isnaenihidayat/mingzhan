name: Desktop compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/desktop-check.yml'
permissions:
  contents: read
jobs:
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun apps/desktop/node_modules/electron/install.js
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0
          sudo chown root:root apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 apps/desktop/node_modules/electron/dist/chrome-sandbox
      - run: bun run --cwd apps/desktop build:runtime
      - if: runner.os != 'Linux'
        run: bun run --cwd apps/desktop test
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run --cwd apps/desktop test
      - if: runner.os != 'Linux'
        run: bun run --cwd apps/desktop test:runtime
      - if: runner.os == 'Linux'
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "mingzhan-ci-only" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a bun run --cwd apps/desktop test:runtime
          '
      - run: bun x electron-builder --dir --publish never
        working-directory: apps/desktop
