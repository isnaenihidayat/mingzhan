appId: com.mingzhan.desktop
productName: MingZhan
executableName: MingZhan
asar: true
extraMetadata:
  name: mingzhan-desktop
npmRebuild: false
directories:
  output: dist/electron
files:
  - main.mjs
  - preload.cjs
  - package.json
publish:
  provider: generic
  url: https://github.com/isnaenihidayat/mingzhan/releases/download/desktop-updates
extraResources:
  - from: dist/runtime
    to: runtime
    filter:
      - '**/*'
  # electron-builder skips node_modules at a resource root; copy its contents explicitly.
  - from: dist/runtime/node_modules
    to: runtime/node_modules
    filter:
      - '**/*'
mac:
  artifactName: MíngZhàn-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  binaries:
    - Contents/Resources/runtime/bin/bun
  icon: ../web/public/icons/icon-512-v2.png
  category: public.app-category.productivity
  minimumSystemVersion: '15.0'
  target:
    - target: dmg
    - target: zip
dmg:
  artifactName: MíngZhàn-${version}-${arch}.dmg
win:
  icon: ../web/public/icons/icon-512-v2.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: MíngZhàn-${version}-${arch}-Setup.exe
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

linux:
  maintainer: MingZhan maintainers
  icon: ../web/public/icons/icon-512-v2.png
  category: Utility
  target:
    - target: AppImage
    - target: deb
